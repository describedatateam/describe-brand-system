<!doctype html>
<html lang="en" data-mode="$mode">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — .describe(</title>
$fontlink
<style>
$fontfaces
:root{ $tokens
  --serif: $serif; --sans: $sans; --mono: $mono;
  --measure: 68ch; }
*{ box-sizing:border-box; }
html{ background:var(--ground); }
body{ margin:0; color:var(--ink); background:var(--ground);
  font:300 16px/1.62 var(--sans); -webkit-font-smoothing:antialiased; }
.page{ max-width:880px; margin:0 auto; padding:48px 32px 64px; background:var(--panel); }
header.cover{ border-bottom:1px solid var(--rule); padding-bottom:32px; margin-bottom:32px; }
.lockup svg{ height:28px; width:auto; display:block; }
.meta{ margin-top:48px; font:500 11px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase;
  color:var(--dim); display:flex; gap:24px; flex-wrap:wrap; }
h1{ font:300 44px/1.06 var(--serif); letter-spacing:-.022em; margin:12px 0 0; max-width:20ch; }
.dek{ font-size:19px; line-height:1.5; color:var(--body); margin:16px 0 0; max-width:var(--measure); }
nav.toc{ margin:0 0 40px; }
nav.toc ol{ margin:0; padding:0; list-style:none; counter-reset:t; columns:2; column-gap:32px; }
nav.toc li{ counter-increment:t; padding:6px 0; border-top:1px solid var(--rule); break-inside:avoid; }
nav.toc li::before{ content:counter(t, decimal-leading-zero); font:500 11px var(--mono); color:var(--dim); margin-right:12px; }
nav.toc a{ color:var(--ink); text-decoration:none; }
main{ counter-reset:s; }
h2{ counter-increment:s; font:300 28px/1.14 var(--serif); letter-spacing:-.016em; margin:48px 0 12px;
  padding-top:16px; border-top:1px solid var(--rule); }
h2::before{ content:counter(s, decimal-leading-zero); display:block; font:500 11px/1.4 var(--mono);
  letter-spacing:.12em; color:var(--story); margin-bottom:8px; }
p{ max-width:var(--measure); margin:0 0 16px; }
strong{ font-weight:500; }
.stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule); margin:24px 0 32px; }
.stat{ background:var(--panel); padding:16px 16px 20px; }
.stat__value{ font:300 40px/1 var(--serif); letter-spacing:-.02em; font-variant-numeric:proportional-nums; }
.stat__label{ margin-top:8px; font-size:14px; color:var(--ink); }
.stat__note{ margin-top:4px; font:400 11px/1.4 var(--mono); color:var(--dim); }
figure.chart{ margin:24px 0 32px; break-inside:avoid; }
figure.chart svg{ width:100%; height:auto; display:block; }
figcaption{ font-size:13px; color:var(--body); margin-top:8px; max-width:var(--measure); }
.table-wrap{ margin:24px 0 32px; break-inside:avoid; overflow-x:auto; }
table{ border-collapse:collapse; width:100%; font-size:14px; }
caption{ text-align:left; font:300 19px/1.3 var(--serif); padding-bottom:12px; }
th{ font:500 11px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  text-align:left; padding:8px 12px 8px 0; border-bottom:1px solid var(--body); }
td{ padding:8px 12px 8px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
.num{ text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
th.num{ text-align:right; }
.null{ text-align:right; color:var(--dim); }
.prov{ margin-top:8px; font:400 11px/1.4 var(--sans); color:var(--body); }
.prov .n{ font-family:var(--mono); color:var(--ink); }
footer.end{ margin-top:64px; padding-top:16px; border-top:1px solid var(--rule);
  font:400 11px/1.4 var(--mono); color:var(--dim); display:flex; justify-content:space-between; }
.running{ display:none; }
@media (max-width:640px){ .page{ padding:32px 16px 48px; } h1{ font-size:34px; } nav.toc ol{ columns:1; } }

/* ---- print / PDF ---- */
@page{ size:A4; margin:22mm 18mm 22mm;
  @bottom-left{ content:element(running); }
  @bottom-right{ content:counter(page) " / " counter(pages); font:400 8pt var(--mono); color:var(--dim); } }
@page :first{ @bottom-left{ content:none; } @bottom-right{ content:none; } }
@media print{
  html, body{ background:var(--panel); }
  body{ font-size:10.5pt; }
  .page{ max-width:none; padding:0; }
  header.cover{ min-height:240mm; display:flex; flex-direction:column; justify-content:space-between;
    border-bottom:none; page-break-after:always; }
  header.cover h1{ font-size:40pt; }
  nav.toc{ display:none; }
  .stats{ grid-template-columns:repeat(3, 1fr); }
  h2{ break-after:avoid; }
  .running{ display:block; position:running(running); font:400 8pt var(--mono); color:var(--dim); }
  footer.end{ display:none; }
}
</style>
</head>
<body>
<div class="page">
  <header class="cover">
    <div>
      <div class="lockup">$lockup</div>
      <div class="meta"><span>$issued</span>$client</div>
      <h1>$title</h1>
      $dek
    </div>
    <div class="meta"><span>$author</span></div>
  </header>
  <div class="running">.describe( · $title</div>
  <nav class="toc" aria-label="Contents"><ol>$toc</ol></nav>
  <main>
$body
  </main>
  <footer class="end"><span>.describe(</span><span>$issued</span></footer>
</div>
</body>
</html>
