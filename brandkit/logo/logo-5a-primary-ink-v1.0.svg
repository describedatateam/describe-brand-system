<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 240 240" role="img" aria-labelledby="t-5a-primary-ink d-5a-primary-ink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t-5a-primary-ink">.describe( astrolabe mark, single ink</title><desc id="d-5a-primary-ink">The .describe( astrolabe mark: an open graduated ring interrupted at the upper right by a target star, with a tangent bowl, a horizontal sighting rule and a vertical stem. An instrument for knowing where you are so you can decide where to go.</desc><g id="RING"><path d="M176.9 61.49A86 86 0 1 1 149.82 29.9" fill="none" stroke="#092052" stroke-width="4" stroke-linecap="round"/></g><g id="BOWL"><circle cx="66.59" cy="128.63" r="42" fill="none" stroke="#092052" stroke-width="4"/></g><g id="RULE"><path d="M24.59 128.63H108.59" fill="none" stroke="#092052" stroke-width="4" stroke-linecap="round"/></g><g id="STEM"><path d="M108.59 21.86V170.63" fill="none" stroke="#092052" stroke-width="6.8" stroke-linecap="round"/></g><g id="STAR"><circle cx="165.3" cy="44.03" r="2.8" fill="#092052"/><path d="M165.3 44.03L171.28 44.49M165.3 44.03L171.81 51.63M165.3 44.03L164.84 50.02M165.3 44.03L157.7 50.54M165.3 44.03L159.32 43.57M165.3 44.03L158.79 36.44M165.3 44.03L165.76 38.05M165.3 44.03L188.08 24.51" fill="none" stroke="#092052" stroke-width="3" stroke-linecap="round"/></g><g id="DOT"><circle cx="34.7" cy="155.97" r="5.6" fill="#092052"/></g></svg>
