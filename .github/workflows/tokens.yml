name: tokens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files are up to date
        run: python3 tokens/build.py --check
      - name: Contrast, palette and drift checks
        run: python3 tokens/check.py
